<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="晓康的笔记 · 浅色静态知识库，顶部大类 + 左侧子主题 + 页面内知识点">
  <meta name="theme-color" content="#f5f8fc">
  <title>晓康的笔记</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314b8a6'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E8%AE%B0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="progress-bar" id="progressBar"></div>

  <header class="topbar">
    <div class="topbar__main">
      <button class="icon-btn menu-toggle" id="menuToggle" type="button" aria-label="打开菜单">☰</button>
      <a class="brand" href="#/home">
        <span class="brand__mark">记</span>
        <span class="brand__text" id="brandText">晓康的笔记</span>
      </a>
      <div class="search">
        <input class="search__input" id="searchInput" type="search" autocomplete="off"
               placeholder="搜索知识点…（按 / 聚焦）" aria-label="搜索笔记">
        <div class="search-results" id="searchResults" hidden></div>
      </div>
      <button class="icon-btn" id="randomBtn" type="button" title="随机来一篇" aria-label="随机一篇">🎲</button>
    </div>
    <div class="topbar__tabs">
      <nav class="segmented" id="segmented" role="tablist" aria-label="主题分类"></nav>
      <a class="topbar__guide" href="#/guide">使用指南</a>
    </div>
  </header>

  <div class="scrim" id="scrim"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav class="nav-tree" id="navTree" aria-label="左侧导航"></nav>
      <div class="sidebar__footer" id="sidebarFooter"></div>
    </aside>

    <main class="content" id="content">
      <div class="content__inner" id="contentInner"></div>
    </main>

    <aside class="toc" id="tocPanel" hidden>
      <div class="toc__title">本页目录</div>
      <ul class="toc__list" id="tocList"></ul>
    </aside>

    <footer class="site-footer" id="siteFooter"></footer>
  </div>

  <button class="back-top" id="backTop" type="button" aria-label="回到顶部">↑ 顶部</button>

  <script src="assets/js/markdown.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
