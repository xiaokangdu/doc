<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="个人知识笔记 · 浅色静态站点，支持多级菜单、全文搜索与持续扩展">
  <meta name="theme-color" content="#f5f8fc">
  <title>知识笔记</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233b82f6'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E7%9F%A5%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="progress-bar" id="progressBar"></div>

  <header class="topbar">
    <button class="icon-btn menu-toggle" id="menuToggle" type="button" aria-label="打开菜单">☰</button>
    <a class="brand" href="#/home">
      <span class="brand__mark">知</span>
      <span class="brand__text" id="brandText">知识笔记</span>
    </a>

    <div class="search">
      <input class="search__input" id="searchInput" type="search" autocomplete="off"
             placeholder="搜索笔记…（按 / 聚焦）" aria-label="搜索笔记">
      <div class="search-results" id="searchResults" hidden></div>
    </div>

    <button class="icon-btn" id="randomBtn" type="button" title="随机来一篇" aria-label="随机一篇">🎲</button>
  </header>

  <div class="scrim" id="scrim"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav class="nav-tree" id="navTree" aria-label="笔记导航"></nav>
      <div class="nav-section" id="sidebarFooter"></div>
    </aside>

    <main class="content" id="content">
      <div class="content__inner" id="contentInner"></div>
    </main>

    <aside class="toc" id="tocPanel" hidden>
      <div class="toc__title">本页目录</div>
      <ul class="toc__list" id="tocList"></ul>
    </aside>

    <footer class="site-footer" id="siteFooter"></footer>
  </div>

  <button class="back-top" id="backTop" type="button" aria-label="回到顶部">↑</button>

  <script src="assets/js/markdown.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
